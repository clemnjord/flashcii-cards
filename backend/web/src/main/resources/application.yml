spring:
  application:
    name: flashcii-web
  datasource:
    url: jdbc:h2:file:./data/flashciicards-db;DB_CLOSE_ON_EXIT=TRUE
    driver-class-name: org.h2.Driver
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  main:
    banner-mode: "off" # Disable banner for CLI for cleaner output
  sql:
    init:
      mode: always

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.clemnjord.flashcii: ${LOG_LEVEL_APP:DEBUG} # Detailed logs for the application namespace
    org:
      hibernate:
        SQL: ${LOG_LEVEL_SQL:DEBUG}
        type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_TRACE:TRACE}