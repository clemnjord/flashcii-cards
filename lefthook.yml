pre-commit:
  jobs:
    # Get all staged files absolute path and concatenate them with comma, then run spotless:apply with the concatenated files.
    - run: toto=$(.lefthook/pre-commit/replace_spaces.sh {staged_files}) && mvn -f backend/pom.xml spotless:apply -DspotlessFiles=$(toto)
